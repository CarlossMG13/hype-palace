{% extends 'store/base.html' %}

{% block content %}
  <h1>Productos Destacados</h1>

  {% for producto in productos %}
    <div>
      <h2>{{ producto.nombre }}</h2>
      <p>Precio: ${{ producto.precio }}</p>
      <p>Descripción: {{ producto.descripcion }}</p>
      <p>Categoría: {{ producto.categoria }}</p>
      <hr />
    </div>
  {% endfor %}
{% endblock %}
